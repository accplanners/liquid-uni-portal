<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Uni Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f2ee;
        --bg2: #ede9e2;
        --surface: #ffffff;
        --surface2: #faf9f7;
        --border: #e5e0d8;
        --border2: #d6cfc3;
        --coral: #ff6b5b;
        --coral-lt: #fff0ee;
        --teal: #0fb8a0;
        --teal-lt: #e6faf7;
        --violet: #7c5cbf;
        --violet-lt: #f3eeff;
        --amber: #f59e0b;
        --amber-lt: #fffbeb;
        --sky: #0ea5e9;
        --sky-lt: #e0f2fe;
        --rose: #f43f5e;
        --rose-lt: #fff1f2;
        --sb-bg: #2e1f5e;
        --sb-bg2: #3d2a7a;
        --sb-text: rgba(255, 255, 255, 0.7);
        --sb-active: #ffffff;
        --text: #1a1523;
        --text2: #6b6478;
        --text3: #a89eb5;
        --shadow-sm:
          0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
        --shadow-lg:
          0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 10px;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      /* SIDEBAR */
      .sidebar {
        width: 248px;
        background: var(--sb-bg);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 100;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 4px 0 24px rgba(46, 31, 94, 0.18);
      }
      .sidebar-logo {
        padding: 26px 20px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--coral), #ff9f70);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        box-shadow: 0 4px 12px rgba(255, 107, 91, 0.4);
        flex-shrink: 0;
      }
      .logo-text h1 {
        font-family: "Fraunces", serif;
        font-size: 17px;
        color: #fff;
        line-height: 1.1;
      }
      .logo-text span {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-family: "JetBrains Mono", monospace;
      }
      .sidebar-nav {
        flex: 1;
        padding: 14px 12px;
        overflow-y: auto;
      }
      .nav-group {
        margin-bottom: 22px;
      }
      .nav-group-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        padding: 0 10px;
        margin-bottom: 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--sb-text);
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 2px;
        position: relative;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .nav-item.active {
        background: rgba(255, 255, 255, 0.14);
        color: var(--sb-active);
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 60%;
        background: var(--coral);
        border-radius: 0 4px 4px 0;
      }
      .nav-icon {
        font-size: 16px;
        width: 22px;
        text-align: center;
        flex-shrink: 0;
      }
      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .user-av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--coral), var(--amber));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        flex-shrink: 0;
      }
      .user-info {
        flex: 1;
        min-width: 0;
      }
      .user-name {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .user-role {
        font-size: 10px;
        color: var(--coral);
        font-family: "JetBrains Mono", monospace;
        margin-top: 1px;
      }
      .logout-btn {
        color: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        font-size: 16px;
        transition: color 0.2s;
        flex-shrink: 0;
      }
      .logout-btn:hover {
        color: #fff;
      }
      /* TOPBAR */
      .main {
        margin-left: 248px;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        height: 62px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: var(--shadow-sm);
      }
      .topbar-title {
        font-family: "Fraunces", serif;
        font-size: 20px;
        color: var(--text);
      }
      .topbar-bread {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
        font-family: "JetBrains Mono", monospace;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tb-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--bg2);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s;
        color: var(--text2);
      }
      .tb-btn:hover {
        background: var(--violet-lt);
        border-color: var(--violet);
        color: var(--violet);
      }
      .notif-wrap {
        position: relative;
      }
      .notif-wrap::after {
        content: "3";
        position: absolute;
        top: -3px;
        right: -3px;
        width: 16px;
        height: 16px;
        background: var(--coral);
        border-radius: 50%;
        font-size: 9px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        border: 2px solid var(--surface);
      }
      /* CONTENT */
      .content {
        padding: 26px 28px;
        flex: 1;
      }
      /* CARDS */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow-sm);
        transition: box-shadow 0.25s;
      }
      .card:hover {
        box-shadow: var(--shadow);
      }
      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .card-title {
        font-family: "Fraunces", serif;
        font-size: 16px;
        color: var(--text);
      }
      .card-sub {
        font-size: 11.5px;
        color: var(--text3);
        margin-top: 3px;
      }
      /* STAT CARDS */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 22px;
      }
      .stat-card {
        border-radius: 16px;
        padding: 20px;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
        cursor: default;
        box-shadow: var(--shadow);
      }
      .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-lg);
      }
      .stat-card[data-c="coral"] {
        background: linear-gradient(135deg, #ff6b5b, #ff9468);
        color: #fff;
      }
      .stat-card[data-c="teal"] {
        background: linear-gradient(135deg, #0fb8a0, #00d4ba);
        color: #fff;
      }
      .stat-card[data-c="violet"] {
        background: linear-gradient(135deg, #7c5cbf, #9b7fe8);
        color: #fff;
      }
      .stat-card[data-c="amber"] {
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
        color: #fff;
      }
      .stat-card::after {
        content: "";
        position: absolute;
        right: -20px;
        top: -20px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
      }
      .stat-icon-wrap {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-bottom: 14px;
      }
      .stat-val {
        font-family: "Fraunces", serif;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
      }
      .stat-lbl {
        font-size: 12.5px;
        opacity: 0.85;
        margin-top: 5px;
        font-weight: 600;
      }
      .stat-delta {
        font-size: 11px;
        opacity: 0.75;
        margin-top: 8px;
        font-family: "JetBrains Mono", monospace;
      }
      /* GRIDS */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
      .col-2 {
        grid-column: span 2;
      }
      /* TABLE */
      .tbl-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text3);
        padding: 10px 14px;
        text-align: left;
        border-bottom: 2px solid var(--border);
        white-space: nowrap;
      }
      td {
        padding: 12px 14px;
        font-size: 13.5px;
        color: var(--text2);
        border-bottom: 1px solid var(--bg2);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--bg);
        color: var(--text);
      }
      .td-main {
        color: var(--text);
        font-weight: 700;
      }
      /* BADGES */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 100px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .badge::before {
        content: "●";
        font-size: 7px;
      }
      .badge-success {
        background: var(--teal-lt);
        color: #0a8a77;
      }
      .badge-warning {
        background: var(--amber-lt);
        color: #b45309;
      }
      .badge-danger {
        background: var(--rose-lt);
        color: #be123c;
      }
      .badge-info {
        background: var(--sky-lt);
        color: #0369a1;
      }
      .badge-purple {
        background: var(--violet-lt);
        color: var(--violet);
      }
      .badge-coral {
        background: var(--coral-lt);
        color: #c0392b;
      }
      /* BUTTONS */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 18px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 700;
        font-family: "Nunito", sans-serif;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--violet), #9b7fe8);
        color: #fff;
        box-shadow: 0 4px 14px rgba(124, 92, 191, 0.35);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 92, 191, 0.45);
      }
      .btn-coral {
        background: linear-gradient(135deg, var(--coral), #ff9468);
        color: #fff;
        box-shadow: 0 4px 14px rgba(255, 107, 91, 0.35);
      }
      .btn-coral:hover {
        transform: translateY(-1px);
      }
      .btn-teal {
        background: linear-gradient(135deg, var(--teal), #00d4ba);
        color: #fff;
        box-shadow: 0 4px 14px rgba(15, 184, 160, 0.35);
      }
      .btn-teal:hover {
        transform: translateY(-1px);
      }
      .btn-outline {
        background: transparent;
        color: var(--text2);
        border: 1.5px solid var(--border);
      }
      .btn-outline:hover {
        border-color: var(--violet);
        color: var(--violet);
        background: var(--violet-lt);
      }
      .btn-danger {
        background: var(--rose-lt);
        color: var(--rose);
        border: 1.5px solid rgba(244, 63, 94, 0.2);
      }
      .btn-danger:hover {
        background: var(--rose);
        color: #fff;
      }
      .btn-ghost {
        background: var(--bg2);
        color: var(--text2);
        border: none;
      }
      .btn-sm {
        padding: 6px 13px;
        font-size: 12.5px;
        border-radius: 8px;
      }
      .btn-xs {
        padding: 4px 10px;
        font-size: 11.5px;
        border-radius: 7px;
      }
      /* FORM */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .fg {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .fg.full {
        grid-column: span 2;
      }
      label {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text2);
      }
      input,
      select,
      textarea {
        background: var(--bg2);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 9px 13px;
        color: var(--text);
        font-size: 13.5px;
        font-family: "Nunito", sans-serif;
        font-weight: 600;
        transition: all 0.2s;
        width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--violet);
        background: #fff;
        box-shadow: 0 0 0 3px var(--violet-lt);
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(26, 21, 35, 0.45);
        backdrop-filter: blur(6px);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: var(--shadow-lg);
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-hd {
        padding: 22px 26px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-ttl {
        font-family: "Fraunces", serif;
        font-size: 20px;
        color: var(--text);
      }
      .modal-x {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--bg2);
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text2);
        font-size: 17px;
        transition: all 0.2s;
      }
      .modal-x:hover {
        background: var(--rose-lt);
        border-color: var(--rose);
        color: var(--rose);
      }
      .modal-bd {
        padding: 22px 26px;
      }
      .modal-ft {
        padding: 16px 26px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      /* SEARCH */
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 11px;
        padding: 0 14px;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s;
      }
      .search-wrap:focus-within {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px var(--violet-lt);
      }
      .search-wrap input {
        background: none;
        border: none;
        padding: 9px 0;
        flex: 1;
        font-size: 13.5px;
        box-shadow: none;
        width: auto;
      }
      .search-wrap input:focus {
        background: none;
        border: none;
        box-shadow: none;
      }
      .search-ico {
        color: var(--text3);
        font-size: 15px;
        flex-shrink: 0;
      }
      /* PAGE ANIM */
      .page-enter {
        animation: pgIn 0.3s ease;
      }
      @keyframes pgIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* LOGIN */
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #ffecd2 0%,
          #fcb69f 20%,
          #a18cd1 50%,
          #fbc2eb 80%,
          #a6c1ee 100%
        );
        padding: 20px;
      }
      .login-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--surface);
        border-radius: 24px;
        overflow: hidden;
        width: 900px;
        max-width: 100%;
        box-shadow: var(--shadow-lg);
      }
      .login-left {
        background: linear-gradient(
          155deg,
          var(--sb-bg),
          var(--sb-bg2),
          #7c5cbf
        );
        padding: 48px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .login-left::before {
        content: "";
        position: absolute;
        top: -60px;
        right: -60px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255, 107, 91, 0.2);
      }
      .login-left::after {
        content: "";
        position: absolute;
        bottom: -40px;
        left: -40px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(15, 184, 160, 0.15);
      }
      .login-brand h1 {
        font-family: "Fraunces", serif;
        font-size: 32px;
        color: #fff;
        margin-bottom: 8px;
      }
      .login-brand p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        line-height: 1.6;
      }
      .login-feats {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .login-feat {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 13.5px;
        font-weight: 600;
      }
      .feat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--coral);
        flex-shrink: 0;
      }
      .login-right {
        padding: 44px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .login-right h2 {
        font-family: "Fraunces", serif;
        font-size: 26px;
        color: var(--text);
        margin-bottom: 6px;
      }
      .login-right p {
        font-size: 13.5px;
        color: var(--text3);
        margin-bottom: 28px;
      }
      .role-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 20px;
      }
      .role-btn {
        padding: 10px 6px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        background: var(--bg2);
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
      }
      .role-btn:hover,
      .role-btn.active {
        border-color: var(--violet);
        background: var(--violet-lt);
      }
      .role-ico {
        font-size: 20px;
        margin-bottom: 4px;
      }

        width: 100%;

      }
      .cbar-l {
        font-size: 10px;
        color: var(--text3);

        display: flex;
        gap: 12px;
        align-items: flex-start;

        border-radius: 10px;
        transition: background 0.2s;

        font-size: 10.5px;

        display: flex;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--bg2);

        width: 9px;

        font-size: 11px;
        color: var(--text3);

        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--text);
        color: #fff;
        border-radius: 12px;
        padding: 13px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
        font-weight: 700;
        z-index: 500;
        animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ── COURSES ── */

      function CoursesPage() {
        const [modal, setModal] = useState(false);
        const [toast, show] = useToast();

        const [courseList, setCourseList] = useState(courses);
        const [errors, setErrors] = useState({});
        const [search, setSearch] = useState("");

        // form state
        const [form, setForm] = useState({
          id: "",
          name: "",
          dept: "CSE",
          faculty: "",
          credits: 3,
          cap: 60,
          sem: "Sem 1",
        });

        const handleChange = (key, value) => {
          setForm({ ...form, [key]: value });
        };

        const [editId, setEditId] = useState(null);

        const handleSave = () => {
          let newErrors = {};

          if (!form.id) newErrors.id = "Course ID required";
          if (!form.name) newErrors.name = "Course Name required";

          if (courseList.find((c) => c.id === form.id && c.id !== editId)) {
            newErrors.id = "Course ID already exists";
          }

          setErrors(newErrors);

          if (Object.keys(newErrors).length > 0) {
            return;
          }

          if (editId) {
            // UPDATE
            setCourseList(
              courseList.map((c) => (c.id === editId ? { ...form } : c)),
            );
            show("✏️ Course updated");
          } else {
            // CREATE
            setCourseList([...courseList, { ...form, enrolled: 0 }]);
            show("✅ Course created");
          }

          setModal(false);
          setEditId(null);

          setForm({
            id: "",
            name: "",
            dept: "CSE",
            faculty: "",
            credits: 3,
            cap: 60,
            sem: "Sem 1",
          });
        };
        const handleDelete = (id) => {
          setCourseList(courseList.filter((c) => c.id !== id));
          show("🗑️ Course deleted");
        };

        const filteredCourses = courseList.filter(
          (c) =>
            c.name.toLowerCase().includes(search.toLowerCase()) ||
            c.id.toLowerCase().includes(search.toLowerCase()) ||
            (c.faculty || "").toLowerCase().includes(search.toLowerCase()),
        );

        return h(
          "div",

            { k: "admin-dashboard", ic: "👑", l: "Admin Dashboard" },
            { k: "student-dashboard", ic: "🎓", l: "Student Dashboard" },
          ],
        },
        {
          sec: "Management",
          items: [
            { k: "students", ic: "👤", l: "Students" },
            { k: "faculty", ic: "👨‍🏫", l: "Faculty" },
            { k: "courses", ic: "📚", l: "Courses" },
            { k: "enrollment", ic: "📝", l: "Enrollment" },
          ],
        },
        {
          sec: "Academic",
          items: [
            { k: "catalogue", ic: "📖", l: "Course Catalogue" },
            { k: "attendance", ic: "✅", l: "Attendance" },
            { k: "report-card", ic: "🏆", l: "Report Card" },
          ],
        },
        {
          sec: "Finance",
          items: [
            { k: "billing", ic: "💳", l: "Billing" },
            { k: "fee-payment", ic: "💰", l: "Fee Payment" },
          ],
        },
        {
          sec: "Account",
          items: [{ k: "profile", ic: "⚙️", l: "Profile & Settings" }],
        },
      ];
      const titles = {
        dashboard: "Dashboard",
        "admin-dashboard": "Admin Dashboard",
        "student-dashboard": "Student Dashboard",
        students: "Students",
        faculty: "Faculty",
        courses: "Courses",
        enrollment: "Enrollment",
        catalogue: "Course Catalogue",
        attendance: "Attendance",
        "report-card": "Report Card",
        billing: "Billing",
        "fee-payment": "Fee Payment",
        profile: "Profile & Settings",
      };
      const pageMap = {
        dashboard: Dashboard,
        "admin-dashboard": Dashboard,
        "student-dashboard": StudentDashboard,
        students: StudentsPage,
        faculty: FacultyPage,
        courses: CoursesPage,
        enrollment: EnrollmentPage,
        catalogue: CataloguePage,
        attendance: AttendancePage,
        "report-card": ReportCardPage,
        billing: BillingPage,
        "fee-payment": FeePaymentPage,
        profile: ProfilePage,
      };

      /* ── APP ── */
      function App() {
        const [loggedIn, setLoggedIn] = useState(false);
        const [page, setPage] = useState("dashboard");
        const [sbOpen, setSbOpen] = useState(false);
        if (!loggedIn) return h(Login, { onLogin: () => setLoggedIn(true) });
        const Page = pageMap[page] || Dashboard;
        return h(
          "div",
          { className: "app" },
          h(
            "button",
            { className: "sb-toggle", onClick: () => setSbOpen(!sbOpen) },
            "☰",
          ),
          sbOpen &&
            h("div", {
              style: {
                position: "fixed",
                inset: 0,
                background: "rgba(0,0,0,.35)",
                zIndex: 99,
              },
              onClick: () => setSbOpen(false),
            }),
          h(
            "aside",
            { className: "sidebar" + (sbOpen ? " open" : "") },
            h(
              "div",
              { className: "sidebar-logo" },
              h("div", { className: "logo-icon" }, "🎓"),
              h(
                "div",
                { className: "logo-text" },
                h("h1", null, "Liquid Uni"),
                h("span", null, "UNI PORTAL"),
              ),
            ),
            h(
              "nav",
              { className: "sidebar-nav" },
              nav.map((g) =>
                h(
                  "div",
                  { key: g.sec, className: "nav-group" },
                  h("div", { className: "nav-group-label" }, g.sec),
                  g.items.map((it) =>
                    h(
                      "div",
                      {
                        key: it.k,
                        className:
                          "nav-item" + (page === it.k ? " active" : ""),
                        onClick: () => {
                          setPage(it.k);
                          setSbOpen(false);
                        },
                      },
                      h("span", { className: "nav-icon" }, it.ic),
                      h("span", null, it.l),
                    ),
                  ),
                ),
              ),
            ),
            h(
              "div",
              { className: "sidebar-footer" },
              h(
                "div",
                { className: "user-card" },
                h("div", { className: "user-av" }, "A"),
                h(
                  "div",
                  { className: "user-info" },
                  h("div", { className: "user-name" }, "Admin User"),
                  h("div", { className: "user-role" }, "ADMIN"),
                ),
                h(
                  "span",
                  {
                    className: "logout-btn",
                    onClick: () => setLoggedIn(false),
                    title: "Sign out",
                  },
                  "⎋",
                ),
              ),
            ),
          ),
          h(
            "div",
            { className: "main" },
            h(
              "header",
              { className: "topbar" },
              h(
                "div",
                null,
                h(
                  "div",
                  { className: "topbar-title" },
                  titles[page] || "Dashboard",
                ),
                h(
                  "div",
                  { className: "topbar-bread" },
                  "Home / " + (titles[page] || "Dashboard"),
                ),
              ),
              h(
                "div",
                { className: "topbar-right" },
                h(
                  "div",
                  { className: "notif-wrap" },
                  h("div", { className: "tb-btn" }, "🔔"),
                ),
                h("div", { className: "tb-btn" }, "❓"),
                h(
                  "div",
                  {
                    style: {
                      width: "36px",
                      height: "36px",
                      borderRadius: "50%",
                      background:
                        "linear-gradient(135deg,var(--coral),var(--amber))",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: "14px",
                      fontWeight: 800,
                      color: "#fff",
                      cursor: "pointer",
                    },
                  },
                  "A",
                ),
              ),
            ),
            h("main", { className: "conte   nt" }, h(Page, { key: page })),
          ),
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
    </script>
  </body>
</html>
